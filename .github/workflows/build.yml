name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build zsign from source
        run: |
          brew install minizip
          OPENSSL=$(brew --prefix openssl)
          MINIZIP=$(brew --prefix minizip)
          git clone https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign
          g++ -std=c++17 -O3 \
            src/zsign.cpp \
            src/archo.cpp \
            src/bundle.cpp \
            src/certcheck.cpp \
            src/macho.cpp \
            src/metadata.cpp \
            src/openssl.cpp \
            src/signing.cpp \
            src/common/archive.cpp \
            src/common/base64.cpp \
            src/common/fs.cpp \
            src/common/json.cpp \
            src/common/log.cpp \
            src/common/sha.cpp \
            src/common/timer.cpp \
            src/common/util.cpp \
            -Isrc \
            -Isrc/common \
            -I$OPENSSL/include \
            -I$MINIZIP/include \
            -L$OPENSSL/lib \
            -L$MINIZIP/lib \
            -lssl -lcrypto -lz -lminizip \
            -o /usr/local/bin/zsign
          zsign 2>&1 | head -3 || true

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Build unsigned
        run: |
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=56C26K6765

      - name: Package and sign with zsign
        env:
          P12_BASE64:   ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | tr -d ' \n\r' | base64 --decode > /tmp/cert.p12
          APP_PATH=$(find $RUNNER_TEMP/App.xcarchive -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp && zip -qr $RUNNER_TEMP/unsigned.ipa Payload/
          zsign \
            -k /tmp/cert.p12 \
            -p "$P12_PASSWORD" \
            -m wulingProductionMobile.mobileprovision \
            -o $RUNNER_TEMP/App.ipa \
            -z 9 \
            $RUNNER_TEMP/unsigned.ipa
          echo "Signed IPA: $(du -sh $RUNNER_TEMP/App.ipa)"
          rm -f /tmp/cert.p12

      - name: Prepare OTA folder
        run: |
          mkdir -p ota
          cp $RUNNER_TEMP/App.ipa ota/app.ipa
          cp manifest.plist ota/manifest.plist
          cp index.html ota/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayPal-Service-Signed
          path: ${{ runner.temp }}/App.ipa
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f /tmp/cert.p12 $RUNNER_TEMP/unsigned.ipa
