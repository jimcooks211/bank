name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Import certificate into keychain
        env:
          P12_BASE64:   ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | tr -d ' \n\r' | base64 --decode > cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          security create-keychain -p "buildpass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "buildpass" $KEYCHAIN_PATH
          curl -s "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o /tmp/wwdr.cer
          security import /tmp/wwdr.cer -k $KEYCHAIN_PATH
          security import cert.p12 -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -s $KEYCHAIN_PATH \
            ~/Library/Keychains/login.keychain-db \
            /Library/Keychains/System.keychain
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "buildpass" $KEYCHAIN_PATH
          rm -f cert.p12

      - name: Install provisioning profile
        run: |
          PROFILE_UUID="32B473B9-B335-425A-9B7E-4A62A6DB1290"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp wulingProductionMobile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

      - name: Build with fastlane gym
        run: |
          fastlane gym \
            --workspace ios/App/App.xcodeproj/project.xcworkspace \
            --scheme App \
            --configuration Release \
            --export_method enterprise \
            --export_options ios/App/ExportOptions.plist \
            --codesigning_identity "iPhone Distribution: Wuling Power Corporation" \
            --provisioning_profile "com.wuling.productionMobile" => "wulingProductionMobile" \
            --output_directory $RUNNER_TEMP/ipa \
            --output_name App

      - name: Prepare OTA folder
        run: |
          mkdir -p ota
          cp $RUNNER_TEMP/ipa/App.ipa ota/app.ipa
          cp manifest.plist ota/manifest.plist
          cp index.html ota/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayPal-Service-Signed
          path: ${{ runner.temp }}/ipa/App.ipa
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
