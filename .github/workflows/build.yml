name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Trust Apple WWDR certs in system keychain
        run: |
          sudo security add-trusted-cert -d -r trustAsRoot \
            -k /Library/Keychains/System.keychain AppleWWDRCA.cer

      - name: Import certificate into keychain
        env:
          P12_BASE64:   ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | tr -d ' \n\r' | base64 --decode > cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          security create-keychain -p "buildpass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "buildpass" $KEYCHAIN_PATH
          security import cert.p12 -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security list-keychains -s $KEYCHAIN_PATH \
            ~/Library/Keychains/login.keychain-db \
            /Library/Keychains/System.keychain
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "buildpass" $KEYCHAIN_PATH
          rm -f cert.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          PROFILE_UUID="32B473B9-B335-425A-9B7E-4A62A6DB1290"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          python3 -c "
          import base64, os
          data = os.environ['PROFILE_BASE64'].replace(' ','').replace('\n','').replace('\r','')
          with open(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision'), 'wb') as f:
              f.write(base64.b64decode(data))
          "
          cp ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision \
            ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          security cms -D \
            -i ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision \
            | grep -A1 "UUID"

      - name: Validate provisioning profile
        run: |
          PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/32B473B9-B335-425A-9B7E-4A62A6DB1290.mobileprovision
          echo "File size: $(wc -c < "$PROFILE") bytes"
          security cms -D -i "$PROFILE" | grep -E "Name|UUID|TeamIdentifier|ExpirationDate"

      - name: Patch pbxproj and verify
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "=== BEFORE patch ==="
          grep -E "CODE_SIGN_STYLE|ProvisioningStyle|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" "$PBXPROJ" | sort -u

          sed -i '' 's/ProvisioningStyle = Automatic/ProvisioningStyle = Manual/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "iPhone Distribution";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 56C26K6765;/g' "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = \"[^\"]*\";/DEVELOPMENT_TEAM = 56C26K6765;/g" "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "wulingProductionMobile";/g' "$PBXPROJ"

          if ! grep -q "DEVELOPMENT_TEAM = 56C26K6765" "$PBXPROJ"; then
            sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = 56C26K6765;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "wulingProductionMobile";/g' "$PBXPROJ"
          fi

          echo "=== AFTER patch ==="
          grep -E "CODE_SIGN_STYLE|ProvisioningStyle|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" "$PBXPROJ" | sort -u

      - name: Show signing identities
        run: security find-identity -v -p codesigning

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Build and archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution: Wuling Power Corporation" \
            PROVISIONING_PROFILE_SPECIFIER="wulingProductionMobile" \
            PROVISIONING_PROFILE="32B473B9-B335-425A-9B7E-4A62A6DB1290" \
            DEVELOPMENT_TEAM=56C26K6765

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Prepare OTA folder
        run: |
          mkdir -p ota
          cp $RUNNER_TEMP/ipa/*.ipa ota/app.ipa
          cp manifest.plist ota/manifest.plist
          cp index.html ota/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayPal-Service-Signed
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true