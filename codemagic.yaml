workflows:
  ios-distribution:
    name: iOS Distribution
    max_build_duration: 60
    environment:
      groups:
        - ios_signing
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          echo  | base64 -d > /tmp/cert.p12
          echo  | base64 -d > /tmp/profile.mobileprovision
          security create-keychain -p "build" build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P  -A -T /usr/bin/codesign
          security list-keychains -d user -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "build" ~/Library/Keychains/build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" ~/Library/Keychains/build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/c4cc6839-407d-4740-b141-550395 1aad88.mobileprovision
          echo "Profile copied successfully"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build IPA
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=56C26K6765 \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="c4cc6839-407d-4740-b141-550395 1aad88" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/App/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
